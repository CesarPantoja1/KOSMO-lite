# Configuración para SonarQube Cloud Automatic Analysis.
# El análisis automático lee este archivo, no sonar-project.properties.

# Excluir artefactos generados o de compilación del análisis de código fuente.
sonar.exclusions=**/templates/**,**/basic-next-app/**,**/.next/**,**/dist/**,**/build/**,**/node_modules/**

# Los tests, mocks y plantillas se mantienen analizados, pero no participan en
# la métrica de código duplicado. Son repeticiones intencionales de fixtures y
# escenarios de prueba, no duplicación del producto.
sonar.cpd.exclusions=**/tests/**,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/templates/**,**/basic-next-app/**,**/mock/**
