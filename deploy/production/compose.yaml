# KOSMO Production application stack (Oracle Cloud)
#
# This compose file updates only the public application path. It intentionally
# shares the existing `kosmo` Compose project and `kosmo-network` with the
# Oracle observability stack, so Grafana, Prometheus, Loki, Tempo, Promtail,
# cAdvisor and node-exporter remain untouched by application deployments.

services:
  frontend:
    image: ${KOSMO_WEB_IMAGE:?KOSMO_WEB_IMAGE must be set}
    container_name: kosmo-frontend
    init: true
    env_file:
      - .env
    environment:
      PORT: "3000"
    restart: unless-stopped

  backend:
    image: ${KOSMO_API_IMAGE:?KOSMO_API_IMAGE must be set}
    container_name: kosmo-backend
    init: true
    env_file:
      - .env
    environment:
      ENV: production
      PORT: "8000"
      AUTH_DISABLED: "false"
      DEV_GENERATE_SECRETS: "0"
      JWT_PRIVATE_KEY_PATH: /run/kosmo-secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/kosmo-secrets/jwt_public.pem
      # Migrations are executed explicitly by GitHub Actions before this
      # service is recreated, avoiding an implicit migration during startup.
      RUN_MIGRATIONS: "0"
      WORKERS: "4"
      KOSMO_WORKSPACES_DIR: /workspaces
      KOSMO_MCP_BASE_URL: http://backend:8000/mcp
      OPENCODE_LAUNCHER_BASE_URL: http://opencode-launcher:8082
      OPENCODE_LAUNCHER_TOKEN: ${OPENCODE_LAUNCHER_TOKEN:?OPENCODE_LAUNCHER_TOKEN must be set}
      CODE_RUNNER_BASE_URL: http://code-runner:8081
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:?CODE_RUNNER_TOKEN must be set}

    volumes:
      # Persistent, host-visible source code. Include it in the VM backup plan.
      - ./workspaces:/workspaces
      - ./secrets/jwt_private.pem:/run/kosmo-secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/kosmo-secrets/jwt_public.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      opencode-launcher:
        condition: service_healthy
      code-runner:
        condition: service_healthy
    networks: [default, codegen]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3); sys.exit(0 if response.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kosmo-redis
    init: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  opencode-launcher:
    image: ${KOSMO_OPENCODE_IMAGE:?KOSMO_OPENCODE_IMAGE must be set}
    container_name: kosmo-opencode-launcher
    init: true
    # UID 0 owns the Docker socket; GID 1000 can traverse workspaces (0750).
    # Capabilities remain dropped and the workspace mount remains read-only.
    user: "0:1000"
    entrypoint: ["node", "/usr/local/bin/opencode-launcher.js"]
    environment:
      OPENCODE_LAUNCHER_TOKEN: ${OPENCODE_LAUNCHER_TOKEN:?OPENCODE_LAUNCHER_TOKEN must be set}
      KOSMO_OPENCODE_IMAGE: ${KOSMO_OPENCODE_IMAGE:?KOSMO_OPENCODE_IMAGE must be set}
      KOSMO_STACK: production
      KOSMO_NETWORK: kosmo-codegen-network
      KOSMO_WORKSPACES_HOST_PATH: /opt/kosmo/production/workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./workspaces:/workspaces:ro
    expose: ["8082"]
    networks: [codegen]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  code-runner:
    image: ${KOSMO_CODE_RUNNER_IMAGE:?KOSMO_CODE_RUNNER_IMAGE must be set}
    container_name: kosmo-code-runner
    init: true
    environment:
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:?CODE_RUNNER_TOKEN must be set}
      HOME: /tmp
    expose: ["8081"]
    read_only: true
    tmpfs: ["/tmp:rw,exec,nosuid,nodev,size=4g,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 5g
    cpus: "1.5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kosmo-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kosmo-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  default:
    name: kosmo-network
    external: true
  codegen:
    name: kosmo-codegen-network
    driver: bridge

volumes:
  redis_data:
