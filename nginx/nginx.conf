events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # cloudflared preserves CF-Connecting-IP. Nginx owns the derived header,
    # so the backend can rate-limit individual public clients instead of the
    # internal Nginx container address.
    map $http_cf_connecting_ip $kosmo_client_ip {
        default $http_cf_connecting_ip;
        ''      $remote_addr;
    }

    # Basic Settings
    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size 15m;

    # AI Generation requests can be very long. Let's increase timeouts significantly.
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    fastcgi_send_timeout  600s;
    fastcgi_read_timeout  600s;

    # Docker assigns a new IP address whenever an application container is
    # recreated. Resolve service names at request time so Nginx never retains
    # a stale frontend or backend IP between deployments.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # El comodín de Cloudflare debe apuntar al mismo túnel, pero Nginx no debe
    # servir la aplicación para nombres arbitrarios bajo cespan.dev.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name localhost kosmo.cespan.dev staging-kosmo.cespan.dev;

        # API routing
        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Kosmo-Client-IP $kosmo_client_ip;

            # Disable buffering for streaming responses if needed
            proxy_buffering off;
        }

        # OpenAPI docs routing
        location /docs {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /redoc {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend routing
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


}
