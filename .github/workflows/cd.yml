name: Deploy Production

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# Production is shared and must process one approved release at a time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  wait-for-ci:
    name: Wait for CI summary
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (
        startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
    outputs:
      deploy_sha: ${{ steps.target.outputs.sha }}
      candidate_sha: ${{ steps.target.outputs.candidate_sha }}

    steps:
      - name: Resolve merged commit
        id: target
        env:
          DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SHA"
          test -n "$CANDIDATE_SHA"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require a successful CI summary for the merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for ((waited = 0; waited < 600; waited += 10)); do
            check_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100")"
            status="$(jq -r '.check_runs[] | select(.name == "CI summary") | .status' <<<"$check_json" | head -n 1)"
            conclusion="$(jq -r '.check_runs[] | select(.name == "CI summary") | .conclusion' <<<"$check_json" | head -n 1)"

            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "CI summary passed for ${COMMIT_SHA}."
              exit 0
            fi

            if [[ "$status" == "completed" ]]; then
              echo "::error::CI summary finished with conclusion: ${conclusion:-unknown}."
              exit 1
            fi

            sleep 10
          done

          echo "::error::Timed out while waiting for CI summary on ${COMMIT_SHA}."
          exit 1

      - name: Require the merged source to match the staged candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ steps.target.outputs.sha }}
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          merged_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${MERGED_SHA}" --jq '.tree.sha')"
          candidate_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${CANDIDATE_SHA}" --jq '.tree.sha')"
          if [ "$merged_tree" != "$candidate_tree" ]; then
            echo "::error::The merged tree differs from the staged candidate. Rebase the release, redeploy Staging, and merge again."
            exit 1
          fi

  build-backend:
    name: Build API image
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.images.outputs.api }}

    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Define immutable API image reference
        id: images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=${REGISTRY}/${owner}/kosmo-api:sha-${{ needs.wait-for-ci.outputs.candidate_sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require staged API image
        shell: bash
        run: docker buildx imagetools inspect "${{ steps.images.outputs.api }}"

  build-frontend:
    name: Build Web image
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.images.outputs.web }}

    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Define immutable Web image reference
        id: images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "web=${REGISTRY}/${owner}/kosmo-web:sha-${{ needs.wait-for-ci.outputs.candidate_sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require staged Web image
        shell: bash
        run: docker buildx imagetools inspect "${{ steps.images.outputs.web }}"

  build-opencode:
    name: Build OpenCode image
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      opencode_image: ${{ steps.images.outputs.opencode }}
      code_runner_image: ${{ steps.images.outputs.code_runner }}

    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Define immutable OpenCode image reference
        id: images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "opencode=${REGISTRY}/${owner}/kosmo-opencode:sha-${{ needs.wait-for-ci.outputs.candidate_sha }}"
            echo "code_runner=${REGISTRY}/${owner}/kosmo-code-runner:sha-${{ needs.wait-for-ci.outputs.candidate_sha }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require staged code-generation images
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.images.outputs.opencode }}"
          docker buildx imagetools inspect "${{ steps.images.outputs.code_runner }}"

  deploy-production:
    name: Deploy Production
    needs:
      - wait-for-ci
      - build-backend
      - build-frontend
      - build-opencode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Prepare verified SSH connection
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          EXPECTED_HOST_FINGERPRINT: ${{ vars.PRODUCTION_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$EXPECTED_HOST_FINGERPRINT"

          ssh_dir="${RUNNER_TEMP}/kosmo-production-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh-keyscan -t ed25519 "${{ vars.PRODUCTION_HOST }}" > "$ssh_dir/known_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$ssh_dir/known_hosts" -E sha256 | awk '{print $2}')"
          test "$actual_fingerprint" = "$EXPECTED_HOST_FINGERPRINT"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Transfer the application stack and protected configuration
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          PRODUCTION_CODEGEN_ENV_FILE: ${{ secrets.PRODUCTION_CODEGEN_ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV_FILE"
          test -n "$PRODUCTION_CODEGEN_ENV_FILE"

          work_dir="${RUNNER_TEMP}/kosmo-production-deploy"
          install -d -m 700 "$work_dir"
          # GitHub Environment secrets may not end in a newline. Preserve the
          # secret value and terminate it so runtime.env always starts on a
          # separate line when both files are assembled on the server.
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$work_dir/application.env"
          printf '%s\n' "$PRODUCTION_CODEGEN_ENV_FILE" >> "$work_dir/application.env"
          printf '%s\n' \
            "KOSMO_WEB_IMAGE=${{ needs.build-frontend.outputs.web_image }}" \
            "KOSMO_API_IMAGE=${{ needs.build-backend.outputs.api_image }}" \
            "KOSMO_OPENCODE_IMAGE=${{ needs.build-opencode.outputs.opencode_image }}" \
            "KOSMO_CODE_RUNNER_IMAGE=${{ needs.build-opencode.outputs.code_runner_image }}" > "$work_dir/runtime.env"
          chmod 600 "$work_dir/application.env" "$work_dir/runtime.env"

          # Staging below the destination keeps promotion as an atomic rename
          # on the same filesystem, even if /tmp is mounted separately.
          remote_stage_dir="/opt/kosmo/production/.incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$SSH_DIR/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -p "${{ vars.PRODUCTION_SSH_PORT }}" \
            "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}" \
            "set -euo pipefail
             test -d /opt/kosmo/production
             test -w /opt/kosmo/production
             test -x /opt/kosmo/production
             docker info >/dev/null
             available_kb=\$(df -Pk /opt/kosmo/production | awk 'NR == 2 { print \$4 }')
             if [ \"\$available_kb\" -lt \$((7 * 1024 * 1024)) ]; then
               echo \"Production requires at least 7 GiB free before pulling images.\" >&2
               exit 1
             fi
             umask 077
             rm -rf '${remote_stage_dir}'
             mkdir -p '${remote_stage_dir}'"

          scp -i "$SSH_DIR/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -P "${{ vars.PRODUCTION_SSH_PORT }}" \
            deploy/production/compose.yaml nginx/nginx.conf \
            "$work_dir/application.env" "$work_dir/runtime.env" \
            "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}:${remote_stage_dir}/"

          ssh -i "$SSH_DIR/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -p "${{ vars.PRODUCTION_SSH_PORT }}" \
            "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}" \
            "set -euo pipefail
             remote_stage_dir='${remote_stage_dir}'
             # The deployment account owns the directory. Atomic renames avoid
             # truncating files inherited from a previous root deployment.
             chmod 0644 \"\$remote_stage_dir/compose.yaml\" \"\$remote_stage_dir/nginx.conf\"
             chmod 0600 \"\$remote_stage_dir/application.env\" \"\$remote_stage_dir/runtime.env\"
             mv -f \"\$remote_stage_dir/compose.yaml\" /opt/kosmo/production/compose.yaml
             mv -f \"\$remote_stage_dir/nginx.conf\" /opt/kosmo/production/nginx.conf
             mv -f \"\$remote_stage_dir/application.env\" /opt/kosmo/production/application.env
             mv -f \"\$remote_stage_dir/runtime.env\" /opt/kosmo/production/runtime.env
             rmdir \"\$remote_stage_dir\""

      - name: Migrate and deploy on Production
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.PRODUCTION_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"

          printf '%s' "$GHCR_TOKEN" | ssh -i "$SSH_DIR/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -p "${{ vars.PRODUCTION_SSH_PORT }}" \
            "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}" \
            'set -euo pipefail
             cd /opt/kosmo/production
             cat application.env runtime.env > .env
             chmod 600 .env
             rm -f application.env runtime.env
             if ! grep -q "^OPENCODE_LAUNCHER_TOKEN=." .env; then
               printf "OPENCODE_LAUNCHER_TOKEN=%s\n" "$(openssl rand -hex 32)" >> .env
             fi
             for key in DATABASE_URL REDIS_URL REDIS_PASSWORD FERNET_MASTER_KEY CORS_ALLOWED_ORIGINS GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET RAILWAY_CLIENT_ID RAILWAY_CLIENT_SECRET NEXT_PUBLIC_GITHUB_CLIENT_ID NEXT_PUBLIC_RAILWAY_CLIENT_ID NEXT_PUBLIC_DOMAIN_APP; do
               if ! grep -q "^${key}=." .env; then
                 echo "Missing required authentication variable: ${key}" >&2
                 exit 1
               fi
             done
             for key in JWT_ISSUER JWT_AUDIENCE; do
               if ! grep -q "^${key}=." .env; then
                 echo "Missing required JWT variable: ${key}" >&2
                 exit 1
               fi
             done
             for key_file in secrets/jwt_private.pem secrets/jwt_public.pem; do
               if [ ! -s "$key_file" ]; then
                 echo "Missing required JWT key file: ${key_file}" >&2
                 exit 1
               fi
             done
             grep -q '^CLOUDFLARE_TUNNEL_TOKEN=.' .env
             for key in KOSMO_WEB_IMAGE KOSMO_API_IMAGE KOSMO_OPENCODE_IMAGE KOSMO_CODE_RUNNER_IMAGE; do
               if ! grep -q "^${key}=." .env; then
                 echo "Missing generated deployment variable: ${key}" >&2
                 exit 1
               fi
             done
             for key in CODE_RUNNER_TOKEN OPENCODE_LAUNCHER_TOKEN; do
               if ! grep -q "^${key}=." .env; then
                 echo "Missing required code-generation variable: ${key}" >&2
                 exit 1
               fi
             done
             docker network inspect kosmo-network >/dev/null
             docker login ghcr.io --username "${{ vars.PRODUCTION_GHCR_USERNAME }}" --password-stdin
             install -d -m 0750 workspaces
             docker run --rm -v "$PWD/workspaces:/workspaces" alpine:3.22 chown -R 1000:1000 /workspaces
             docker compose -p kosmo -f compose.yaml config -q
             docker compose -p kosmo -f compose.yaml pull
             docker run --rm -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t
             docker run --rm \
               -v "$PWD/secrets/jwt_private.pem:/run/kosmo-secrets/jwt_private.pem:ro" \
               -v "$PWD/secrets/jwt_public.pem:/run/kosmo-secrets/jwt_public.pem:ro" \
               --entrypoint sh "${{ needs.build-backend.outputs.api_image }}" \
               -c "test -r /run/kosmo-secrets/jwt_private.pem && test -r /run/kosmo-secrets/jwt_public.pem"
             docker run --rm --env-file .env --network kosmo-network \
               -e ENV=production \
               -e AUTH_DISABLED=false \
               -e JWT_PRIVATE_KEY_PATH=/run/kosmo-secrets/jwt_private.pem \
               -e JWT_PUBLIC_KEY_PATH=/run/kosmo-secrets/jwt_public.pem \
               -v "$PWD/secrets/jwt_private.pem:/run/kosmo-secrets/jwt_private.pem:ro" \
               -v "$PWD/secrets/jwt_public.pem:/run/kosmo-secrets/jwt_public.pem:ro" \
               --entrypoint alembic "${{ needs.build-backend.outputs.api_image }}" upgrade head
             docker compose -p kosmo -f compose.yaml up -d --remove-orphans
             # Health only checks Docker access; verify the launcher can actually
             # traverse the 0750 project workspace before declaring deployment healthy.
             docker exec kosmo-opencode-launcher node -e "require(\"node:fs\").readdirSync(\"/workspaces\")"
             # Reload the transferred Nginx configuration after app containers
             # have been recreated. --no-deps prevents an unnecessary restart
             # of frontend or backend.
             docker compose -p kosmo -f compose.yaml up -d --no-deps --force-recreate nginx
             for attempt in $(seq 1 24); do
               status="$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}" kosmo-backend)"
               if [ "$status" = healthy ]; then
                 break
               fi
               if [ "$status" = unhealthy ] || [ "$status" = exited ]; then
                 docker compose -p kosmo -f compose.yaml logs --tail=100 backend
                 exit 1
               fi
               sleep 5
             done
             if [ "${status:-unknown}" != healthy ]; then
               docker compose -p kosmo -f compose.yaml logs --tail=100 backend
               exit 1
             fi
             # Exercise the full create → secret-stdin → OpenCode health path
             # with a temporary project and fake key; no prompt is submitted.
             docker exec kosmo-opencode-launcher node /usr/local/bin/opencode-smoke.js
             for attempt in $(seq 1 15); do
               if docker exec kosmo-nginx wget -q -O /dev/null \
                    --header="Host: kosmo.cespan.dev" http://127.0.0.1/ && \
                  docker exec kosmo-nginx wget -q -O /dev/null \
                    --header="Host: kosmo.cespan.dev" http://127.0.0.1/api/v1/ai-config/providers; then
                 docker compose -p kosmo -f compose.yaml ps
                 exit 0
               fi
               sleep 2
             done
             docker compose -p kosmo -f compose.yaml logs --tail=100 nginx backend opencode-launcher
             exit 1
             '

  smoke-test-production:
    name: Smoke test Production
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Verify public frontend and API
        shell: bash
        run: |
          set -euo pipefail

          for endpoint in \
            'https://kosmo.cespan.dev/' \
            'https://kosmo.cespan.dev/api/v1/ai-config/providers'; do
            echo "Checking ${endpoint}"
            curl --fail --show-error --silent --location \
              --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 \
              "$endpoint" > /dev/null
          done
