      description: >-
        Procesa el mensaje y aplica el cambio inmediatamente sobre la caracteristica (titulo, descripcion, origen),
        verificando consistencia downstream en Requisitos y Modelo. Si pertenece a otra fase, devuelve redireccion.
      operationId: feature_chat_send
