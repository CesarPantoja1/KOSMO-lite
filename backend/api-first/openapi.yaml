  # ══════════════════════════════ CONSISTENCY ══════════════════════════════

  /api/v1/projects/{project_id}/consistency/status:
    get:
      tags: [consistency]
      summary: Estado de consistencia pendiente por fase
      description: Badges por fase calculados sobre las evaluaciones no resueltas del proyecto.
      operationId: consistency_status
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Conteos de estado de consistencia por fase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyStatusView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/consistency/review:
    get:
      tags: [consistency]
      summary: Vista de revision de consistencia por fase (gate)
      description: Cards frescas por artefacto destino. Las sugerencias obsoletas se descartan automaticamente.
      operationId: consistency_review
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: target_phase
          in: query
          required: true
          schema:
            type: string
            enum: [features, requirements, model, implementation]
          description: Fase destino a revisar
      responses:
        "200":
          description: Cards agrupadas por artefacto destino
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyReviewView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/consistency/evaluations/{evaluation_id}/apply:
    post:
      tags: [consistency]
      summary: Aplicar una sugerencia de consistencia
      description: Aplica con guardrail de frescura; si la entrada cambio devuelve 409 Conflict.
      operationId: consistency_apply_evaluation
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: evaluation_id
          in: path
          required: true
          schema:
            type: string
          description: ID de la evaluacion (cev_ + ULID)
      responses:
        "200":
          description: Sugerencia aplicada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyEvaluationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La sugerencia ya no aplica al estado actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"

  /api/v1/projects/{project_id}/consistency/evaluations/{evaluation_id}/discard:
    post:
      tags: [consistency]
      summary: Descartar una sugerencia de consistencia
      description: Descartada para este snapshot; si la fuente vuelve a cambiar, aparece una sugerencia nueva.
      operationId: consistency_discard_evaluation
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: evaluation_id
          in: path
          required: true
          schema:
            type: string
          description: ID de la evaluacion (cev_ + ULID)
      responses:
        "200":
          description: Sugerencia descartada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyEvaluationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflicto o sugerencia ya procesada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"

  /api/v1/projects/{project_id}/consistency/review/bulk:
    post:
      tags: [consistency]
      summary: Resolver en lote las sugerencias de una fase
      description: Aplica o descarta todas las sugerencias frescas de la fase destino en un solo clic.
      operationId: consistency_bulk_resolve
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkResolveRequestView"
      responses:
        "200":
          description: Resultado de la resolucion en lote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResolveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Action no valida o fase destino desconocida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"

  /api/v1/projects/{project_id}/consistency/activity:
    get:
      tags: [consistency]
      summary: Feed de actividad de consistencia
      description: Historial de sugerencias aplicadas o descartadas con su origen.
      operationId: consistency_activity
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: Numero maximo de entradas
      responses:
        "200":
          description: Feed de actividad de consistencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyActivityView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/consistency/evaluate:
    post:
      tags: [consistency]
      summary: Evaluar consistencia entre fases
      description: >-
        Evalua el impacto de cambios sobre las fases a la derecha (downstream)
        segun el orden Descubrimiento -> Caracteristicas -> Requisitos -> Modelo.
        Si se intenta evaluar hacia la izquierda (upstream) devuelve 422.
      operationId: consistency_evaluate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateConsistencyRequestView"
      responses:
        "200":
          description: Reporte de impacto de consistencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyReportView"
        "400":
          description: Fase de origen o destino desconocida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Direccion de evaluacion no permitida (upstream)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/consistency/evaluate/stream:
    post:
      tags: [consistency]
      summary: Evaluar consistencia entre fases (SSE streaming)
      description: Evalua el impacto de cambios en cascada con emision de progreso en tiempo real mediante SSE.
      operationId: consistency_evaluate_stream
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateConsistencyRequestView"
      responses:
        "200":
          description: Stream SSE con progreso y reporte final
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ConsistencyStreamEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/projects/{project_id}/consistency/apply:
    post:
      tags: [consistency]
      summary: Aplicar impactos de consistencia
      description: Aplica las acciones sugeridas sobre requisitos, caracteristicas y diagramas.
      operationId: consistency_apply
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyImpactsRequestView"
      responses:
        "200":
          description: Resultado de la aplicacion de impactos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyImpactsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════ CHAT SESSIONS ══════════════════════════════

  /api/v1/projects/{project_id}/chat-sessions:
    get:
      tags: [chat-sessions]
      summary: Listar sesiones de chat de una fase
      description: >-
        Devuelve los hilos de conversacion persistidos de una fase, del mas reciente al mas antiguo,
        con conteo de mensajes y fecha del ultimo.
      operationId: chat_sessions_list
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: phase
          in: query
          required: true
          schema:
            type: string
            enum: [discovery, features, requirements, model]
          description: Fase a listar
        - name: context_id
          in: query
          required: false
          schema:
            type: string
          description: Contexto opcional (id de caracteristica)
      responses:
        "200":
          description: Lista de sesiones de chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionListView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [chat-sessions]
      summary: Crear una sesion de chat nueva con contexto limpio
      description: Crea un hilo nuevo para la fase indicada conservando las sesiones anteriores.
      operationId: chat_sessions_create
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatSessionRequestView"
      responses:
        "201":
          description: Sesion de chat creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/chat-sessions/{session_id}:
    delete:
      tags: [chat-sessions]
      summary: Eliminar una sesion de chat
      description: Elimina el hilo de conversacion y todos sus mensajes asociados.
      operationId: chat_sessions_delete
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Identificador de la sesion (cht_ + ULID)
      responses:
        "204":
          description: Sesion eliminada exitosamente. Sin cuerpo de respuesta.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════ DOCUMENTS ══════════════════════════════

  /api/v1/documents/modify-direct:
    post:
      tags: [documents]
      summary: Modificar documento directamente sin fase de plan
      description: >-
        Recibe una instruccion textual y modifica directamente el documento indicado sin pasar por la fase de plan.
        La IA interpreta la intencion, identifica la seccion y retorna el documento actualizado.
      operationId: documents_modify_direct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentModifyRequestView"
      responses:
        "200":
          description: Documento actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentModifyResponseView"
        "400":
          description: Instruccion ambigua o invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/documents/revert:
    post:
      tags: [documents]
      summary: Revertir a una version anterior del documento
      description: Restaura una version previa del documento de descubrimiento.
      operationId: documents_revert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertDocumentRequest"
      responses:
        "200":
          description: Documento revertido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version_id:
                    type: string
                required: [status, version_id]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════ SCHEMAS ══════════════════════════════

  /api/v1/schemas:
    get:
      tags: [schemas]
      summary: Listar nombres de esquemas disponibles
      description: Devuelve el catalogo de DTOs disponibles para introspeccion de esquemas JSON.
      operationId: schemas_list
      responses:
        "200":
          description: Lista de esquemas registrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                required: [schemas]

  /api/v1/schemas/{name}:
    get:
      tags: [schemas]
      summary: Obtener JSON Schema de un DTO
      description: Devuelve el JSON Schema generado a partir del modelo Pydantic indicado.
      operationId: schemas_get
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Nombre del DTO (ej. RegisterRequest, CreateProjectRequest)
      responses:
        "200":
          description: JSON Schema del DTO
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Esquema no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"

  # ══════════════════════════════ KNOWLEDGE ══════════════════════════════

  /api/v1/knowledge/consolidate:
    post:
      tags: [knowledge]
      summary: Consolidar patrones de conocimiento cross-project
      description: Consolida reflexiones y patrones de sesiones de agentes en memoria compartida cross-project.
      operationId: knowledge_consolidate
      responses:
        "200":
          description: Patrones consolidados por fase
          content:
            application/json:
              schema:
                type: object
                properties:
                  phases:
                    type: array
                    items:
                      type: object
                required: [phases]
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════ TRACEABILITY ══════════════════════════════

  /api/v1/projects/{project_id}/traceability/{entity_id}/navigation:
    get:
      tags: [Traceability]
      summary: Verificar navegación de trazabilidad por proyecto
      description: Verifica si la edición está permitida en este nivel de SDD para una entidad de un proyecto.
      operationId: check_project_traceability_navigation
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
          description: Identificador de la entidad a verificar
        - name: level
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SpecPhase"
          description: Fase de la entidad
      responses:
        "200":
          description: Estado de navegación y trazabilidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceabilityNavigationOutputView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/traceability/{entity_id}/navigation:
    get:
      tags: [Traceability]
      summary: Verificar navegación de trazabilidad (Legacy)
      deprecated: true
      description: Ruta legacy; migrar a /api/v1/projects/{project_id}/traceability/{entity_id}/navigation.
      operationId: check_traceability_navigation
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
          description: Identificador de la entidad a verificar
        - name: level
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SpecPhase"
          description: Fase de la entidad
      responses:
        "200":
          description: Estado de navegación y trazabilidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceabilityNavigationOutputView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ══════════════════════════════ MCP TOOLS ══════════════════════════════

  /mcp/tools/get_requirements:
    post:
      tags: [MCP Tools]
      summary: Obtener requisitos EARS de una caracteristica
      description: Retorna los requisitos EARS en formato markdown para la caracteristica indicada (para agentes OpenCode).
      operationId: mcp_get_requirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPToolRequest"
      responses:
        "200":
          description: Requisitos EARS en Markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPToolResponse"
        "404":
          description: Requisitos no encontrados para la caracteristica indicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"

  /mcp/tools/get_activity_diagram:
    post:
      tags: [MCP Tools]
      summary: Obtener diagrama de actividad de una caracteristica
      description: Retorna el diagrama de actividad en formato PlantUML para la caracteristica indicada (para agentes OpenCode).
      operationId: mcp_get_activity_diagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPToolRequest"
      responses:
        "200":
          description: Diagrama de actividad en PlantUML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPToolResponse"
        "404":
          description: Diagrama no encontrado para la caracteristica indicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"

  # ══════════════════════════════ IMPLEMENTATIONS ══════════════════════════════

  /api/v1/implementations:
    post:
      tags: [Implementations]
      summary: Iniciar implementacion
      description: Inicia asincronamente la generacion de codigo fuente para una caracteristica mediante OpenCode.
      operationId: implementations_start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImplementationRequest"
      responses:
        "202":
          description: Implementacion iniciada asincronamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateImplementationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Implementations]
      summary: Obtener implementacion por caracteristica
      description: >-
        Devuelve el registro persistido de la implementacion de una caracteristica (fuente de verdad para el frontend).
      operationId: implementations_get_by_feature
      parameters:
        - name: feature_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: ID de la caracteristica
      responses:
        "200":
          description: Registro persistido de la implementacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImplementationRecordResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No se encontro una implementacion para la caracteristica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"

  /api/v1/implementations/{implementation_id}/events:
    get:
      tags: [Implementations]
      summary: Suscribirse a eventos de implementacion
      description: Flujo SSE para eventos en tiempo real emitidos durante la generacion de codigo.
      operationId: implementations_stream_events
      parameters:
        - name: implementation_id
          in: path
          required: true
          schema:
            type: string
          description: ID de la implementacion iniciada
      responses:
        "200":
          description: Stream SSE de eventos de implementacion
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/implementations/{implementation_id}/files/content:
    get:
      tags: [Implementations]
      summary: Leer contenido de un archivo generado
      description: Devuelve el contenido de un archivo del workspace de la implementacion, validando seguridad de ruta.
      operationId: implementations_get_file_content
      parameters:
        - name: implementation_id
          in: path
          required: true
          schema:
            type: string
          description: ID de la implementacion
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Ruta relativa del archivo dentro del workspace
      responses:
        "200":
          description: Contenido del archivo en texto plano
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImplementationFileContentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Implementacion, workspace o archivo no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "422":
          description: Ruta insegura o fuera del workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"

  /api/v1/implementations/{implementation_id}/validate:
    post:
      tags: [Implementations]
      summary: Validar workspace de implementación en contenedor efímero
      description: >-
        Ejecuta el pipeline de validación determinística (typecheck, linter, tests y build)
        sobre el workspace de la implementación dentro de un contenedor Docker efímero (kosmo-validator)
        que se destruye inmediatamente al finalizar, garantizando que el espacio de trabajo local
        permanezca limpio antes de la sincronización remota.
      operationId: implementations_validate_workspace
      parameters:
        - name: implementation_id
          in: path
          required: true
          schema:
            type: string
          description: ID de la implementación
      responses:
        "200":
          description: Resultado estructurado de todos los pasos de validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateWorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Implementación o workspace no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ AI CONFIG (HU-25 BYOK) ══════════════════════════════

  /api/v1/ai-config/providers:
    get:
      tags: [ai_config]
      summary: Obtener catálogo de proveedores y modelos de IA disponibles
      description: >-
        Devuelve el catálogo completo de proveedores de Inteligencia Artificial soportados
        (Anthropic, OpenAI, Google, OpenRouter) junto con los modelos disponibles y sus respectivos tiers
        para facilitar la selección dinámica en el formulario de configuración.
      operationId: ai_config_get_providers
      responses:
        "200":
          description: Catálogo de proveedores y modelos de IA disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIProviderInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ai-config:
    get:
      tags: [ai_config]
      summary: Obtener configuración del proveedor de IA del usuario
      description: >-
        Devuelve las preferencias de Inteligencia Artificial del usuario autenticado (proveedor,
        modelo y clave de API enmascarada). Si el usuario no tiene una clave personalizada configurada,
        indica que opera bajo el proveedor y modelo predeterminados de la plataforma KOSMO.
      operationId: ai_config_get
      responses:
        "200":
          description: Configuración de IA activa del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ai_config]
      summary: Guardar o actualizar configuración del proveedor de IA
      description: >-
        Persiste la selección de proveedor y modelo de IA del usuario. Si se envía una nueva clave de API,
        el servidor la cifra simétricamente mediante Fernet antes de almacenarla en la base de datos.
        La respuesta devuelve la clave enmascarada mostrando únicamente los últimos 4 caracteres.
      operationId: ai_config_save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAIConfigRequest"
      responses:
        "200":
          description: Configuración de IA actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [ai_config]
      summary: Eliminar credenciales personalizadas de IA
      description: >-
        Elimina la clave de API personalizada del usuario de la base de datos y restablece la generación
        de código al proveedor y modelo predeterminados de KOSMO.
      operationId: ai_config_delete
      responses:
        "204":
          description: Credenciales eliminadas y configuración restablecida a los valores predeterminados. Sin cuerpo de respuesta.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ai-config/test:
    post:
      tags: [ai_config]
      summary: Probar conexión con proveedor de IA
      description: >-
        Ejecuta una llamada ligera de comprobación contra la API del proveedor de Inteligencia Artificial
        seleccionado utilizando la clave proporcionada (o la clave persistida del usuario si se omite).
        Valida la disponibilidad del servicio y confirma el identificador del modelo detectado sin persistir
        cambios en el perfil.
      operationId: ai_config_test_connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAIConnectionRequest"
      responses:
        "200":
          description: Resultado cualitativo de la prueba de conexión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAIConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Error al comunicarse con la API del proveedor externo de IA (credencial inválida, permisos insuficientes o servicio no disponible)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ INTEGRATIONS (OAUTH) ══════════════════════════════

  /api/v1/integrations/{provider}/connect:
    post:
      tags: [integrations]
      summary: Vincular cuenta de plataforma externa mediante OAuth
      description: >-
        Procesa el código de autorización temporal emitido tras el flujo OAuth con la plataforma externa
        (github o railway), intercambia el código por el token de acceso correspondiente, lo cifra
        simétricamente con Fernet y lo asocia a la cuenta del usuario autenticado.
      operationId: integrations_connect
      parameters:
        - $ref: "#/components/parameters/IntegrationProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectOAuthRequest"
      responses:
        "200":
          description: Cuenta vinculada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatusResponse"
        "400":
          description: Código de autorización OAuth inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permisos insuficientes en la plataforma externa
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Error al comunicarse con el servidor OAuth de la plataforma externa
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/integrations/{provider}/status:
    get:
      tags: [integrations]
      summary: Consultar estado de vinculación de plataforma externa
      description: >-
        Verifica si el usuario autenticado tiene una cuenta vinculada activa para la plataforma especificada
        (github o railway), devolviendo los metadatos públicos de la conexión sin exponer credenciales sensibles.
      operationId: integrations_get_status
      parameters:
        - $ref: "#/components/parameters/IntegrationProvider"
      responses:
        "200":
          description: Estado de la vinculación con la plataforma externa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/integrations/{provider}:
    delete:
      tags: [integrations]
      summary: Desvincular plataforma externa
      description: >-
        Revoca y elimina las credenciales OAuth almacenadas de la plataforma externa especificada
        para la cuenta del usuario autenticado.
      operationId: integrations_disconnect
      parameters:
        - $ref: "#/components/parameters/IntegrationProvider"
      responses:
        "204":
          description: Plataforma externa desvinculada exitosamente. Sin cuerpo de respuesta.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: La integración no se encuentra vinculada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ GITHUB SYNC (HU-23) ══════════════════════════════

  /api/v1/projects/{project_id}/github:
    get:
      tags: [github]
      summary: Obtener estado de integración con GitHub del proyecto
      description: >-
        Devuelve los metadatos del repositorio remoto en GitHub asociado al proyecto, incluyendo la URL remota,
        visibilidad pública, fecha de la última sincronización y hash del último commit enviado.
      operationId: project_github_get_status
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Estado de sincronización con GitHub del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitHubResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/github/push:
    post:
      tags: [github]
      summary: Crear repositorio o sincronizar código en GitHub
      description: >-
        Orquesta la subida del código fuente del proyecto hacia GitHub.
        1. Ejecuta la validación previa del workspace en un contenedor efímero.
        2. Si el proyecto aún no tiene un repositorio asociado, lo crea vía API de GitHub con visibilidad pública obligatoria
           y configura el remote origin.
        3. Si el repositorio ya existe, realiza un push incremental con los nuevos commits.
        4. Actualiza y persiste los metadatos de sincronización en la base de datos.
      operationId: project_github_push
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushGitHubRequest"
      responses:
        "200":
          description: Código sincronizado exitosamente con el repositorio en GitHub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitHubResponse"
        "400":
          description: Parámetros de repositorio inválidos o nombre no disponible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Conflicto: el usuario no ha vinculado su cuenta de GitHub o el proyecto no tiene funcionalidades implementadas"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Fallo de validación en contenedor efímero antes de subir el código
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Error al comunicarse con la API de GitHub o al ejecutar la operación Git remota
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ══════════════════════════════ DEPLOY RAILWAY (HU-24) ══════════════════════════════

  /api/v1/projects/{project_id}/deploy:
    get:
      tags: [deploy]
      summary: Obtener estado de despliegue en la nube
      description: >-
        Consulta el estado de publicación del proyecto en Railway (idle, pending, building, ready, failed),
        la URL pública accesible en internet, marca de tiempo del último despliegue y enlace a logs en caso de fallo.
      operationId: project_deploy_get_status
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Estado actual del despliegue del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeployStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [deploy]
      summary: Eliminar despliegue del proyecto
      description: Elimina el servicio remoto en la nube y retira el registro de despliegue del proyecto.
      operationId: delete_project_deployment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Despliegue eliminado exitosamente
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/projects/{project_id}/deploy/railway:
    post:
      tags: [deploy]
      summary: Iniciar despliegue del proyecto en Railway
      description: >-
        Orquesta la publicación de la aplicación en la nube mediante Railway de forma idempotente:
        1. Valida que el proyecto cuente con un repositorio GitHub sincronizado y que la cuenta de Railway esté vinculada.
        2. En el primer despliegue: crea el servicio en Railway conectado al repositorio remoto y configura el volumen persistente (/data/db.sqlite) con variables de entorno.
        3. En redespliegues: reutiliza el servicio remoto existente de forma idempotente sin duplicar servicios ni reconfigurar volúmenes.
        4. Dispara la construcción en Railway a través de GraphQL/REST y actualiza el estado a 'building'.
        5. Inicia el worker de monitoreo asíncrono en segundo plano con auto-renovación de credenciales OAuth y persistencia de estado terminal (ready/failed).
      operationId: project_deploy_railway_start
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRailwayRequest"
      responses:
        "202":
          description: Despliegue iniciado asíncronamente en la plataforma de Railway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeployStatusResponse"
        "400":
          description: Configuración de despliegue inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permisos insuficientes en la plataforma de despliegue
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Precondición no cumplida: el proyecto no tiene repositorio en GitHub o la cuenta de Railway no está vinculada"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Límite de solicitudes de la API de despliegue excedido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Error al interactuar con la API de Railway
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por /api/v1/auth/token o /api/v1/auth/refresh

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: Identificador del proyecto (prj_ + ULID)
    FeatureId:
      name: feature_id
      in: path
      required: true
      schema:
        type: string
      description: Identificador o slug de la característica
    ProjectIdQuery:
      name: project_id
      in: query
      required: true
      schema:
        type: string
      description: Identificador del proyecto
    CursorBefore:
      name: before
      in: query
      required: false
      schema:
        type: string
      description: Cursor ISO-8601 para paginación hacia atrás
    SessionIdQuery:
      name: session_id
      in: query
      required: false
      schema:
        type: string
      description: Hilo de conversación (cht_ + ULID). Si se omite, contexto de la fase.
    IntegrationProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IntegrationProviderEnum"
      description: Identificador del proveedor de integración externa (github | railway)
    ProjectIdRateLimitQuery:
      name: project_id
      in: query
      required: false
      schema:
        type: string
        default: ""
      description: Identificador opcional del proyecto para aplicar rate limiting cuando se invoca fuera de una ruta anidada de proyecto.

  responses:
    Unauthorized:
      description: Token de acceso ausente, invalido, expirado o revocado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpErrorResponse"
    Forbidden:
      description: Acceso no autorizado al recurso del proyecto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpErrorResponse"
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadRequest:
      description: Peticion invalida o error de validacion
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadGateway:
      description: Error al invocar el servicio de IA o LLM
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpErrorResponse"
    UnprocessableEntity:
      description: Contenido no procesable o violacion de reglas semanticas
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    ProblemDetail:
      type: object
      description: Error RFC 7807 (application/problem+json)
      properties:
        type:
          type: string
          description: URN del error (ej. urn:kosmo:projects:not-found)
          example: urn:kosmo:projects:not-found
        title:
          type: string
          description: Titulo corto del error
        status:
          type: integer
          description: Codigo de estado HTTP
        detail:
          type: string
          description: Descripcion detallada del error
        instance:
          type: string
          description: Ruta o recurso que origino el error
        trace_id:
          type: string
          description: Identificador de correlacion distribuida (X-Trace-Id)
        violations:
          type: array
          items:
            type: object
            properties:
              loc:
                type: string
                description: Ruta al campo invalido
              msg:
                type: string
                description: Mensaje de error de validacion
              input:
                description: Valor recibido que causo la violacion
      required: [type, title, status, detail]

    HttpErrorResponse:
      type: object
      description: Respuesta de error generica para errores HTTP (4xx/5xx)
      properties:
        detail:
          type: string
          description: Mensaje descriptivo del error
          example: Recurso no encontrado.
      required: [detail]

    # ── Auth ──

    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre completo del usuario
          example: Gianfranco
        email:
          type: string
          format: email
          description: Direccion de correo electronico unica
          example: usuario@ejemplo.com
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Contrasena en texto plano (se hashea con Argon2id)
          example: "M1ContrasenaSegura!"
      required: [name, email, password]

    AuthorizeRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          example: usuario@ejemplo.com
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Contrasena en texto plano
          example: "M1ContrasenaSegura!"
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
          description: Hash SHA-256 del code_verifier en Base64URL sin padding
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method:
          type: string
          enum: [S256]
          default: S256
          description: Metodo de transformacion PKCE
          example: S256
        scopes:
          type: array
          items:
            type: string
          default: []
          description: Permisos solicitados para la sesion
          example: ["profile:read", "agent:run"]
      required: [email, password, code_challenge]

    TokenExchangeRequest:
      type: object
      additionalProperties: false
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
          description: Debe ser exactamente 'authorization_code'
          example: authorization_code
        code:
          type: string
          minLength: 1
          maxLength: 256
          description: Codigo de autorizacion opaco devuelto por /authorize
          example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: Secreto original generado por el cliente
          example: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      required: [grant_type, code, code_verifier]

    TokenRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
          description: Debe ser exactamente 'refresh_token'
          example: refresh_token
        refresh_token:
          type: string
          minLength: 1
          description: JWT de tipo refresh emitido previamente
      required: [grant_type, refresh_token]

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          nullable: true
          description: JWT de tipo refresh a revocar junto con el access token
      required: []

    RegisterResponse:
      type: object
      description: Confirmacion generica de registro para mitigar enumeracion de usuarios (CWE-204)
      properties:
        email:
          type: string
          format: email
          example: usuario@ejemplo.com
        message:
          type: string
          example: Si el correo no estaba registrado previamente, la cuenta ha sido creada exitosamente.
      required: [email, message]

    UserPublic:
      type: object
      description: Datos publicos del usuario registrado
      properties:
        id:
          type: string
          description: Identificador unico (usr_ + ULID)
          example: usr_01HXYAZABCDEFGHIJKLMNOP
        name:
          type: string
          description: Nombre completo del usuario
          example: Gianfranco
        email:
          type: string
          format: email
          example: usuario@ejemplo.com
        avatar_url:
          type: string
          nullable: true
          description: URL del avatar del usuario
          example: https://avatars.githubusercontent.com/u/123456?v=4
        created_at:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00Z"
      required: [id, name, email, created_at]

    AuthorizationCodeResponse:
      type: object
      properties:
        authorization_code:
          type: string
          description: Codigo de autorizacion opaco de un solo uso
          example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
        expires_in:
          type: integer
          minimum: 1
          maximum: 600
          description: Segundos hasta expiracion
          example: 300
      required: [authorization_code, expires_in]

    TokenView:
      type: object
      properties:
        token:
          type: string
          description: Token JWT firmado con RS256
        jti:
          type: string
          description: JWT ID unico para revocacion en Redis
          example: ati-01HXYAZABCDEFGHIJKLMNOP
        expires_at:
          type: string
          format: date-time
          example: "2026-12-31T23:59:59Z"
      required: [token, jti, expires_at]

    TokenPairResponse:
      type: object
      properties:
        access:
          $ref: "#/components/schemas/TokenView"
        refresh:
          $ref: "#/components/schemas/TokenView"
        token_type:
          type: string
          enum: [Bearer]
          default: Bearer
          example: Bearer
      required: [access, refresh, token_type]

    PrincipalView:
      type: object
      properties:
        subject:
          type: string
          description: Identificador del usuario propietario del token
          example: usr_01HXYAZABCDEFGHIJKLMNOP
        name:
          type: string
          nullable: true
          description: Nombre completo del usuario
          example: Gianfranco
        email:
          type: string
          format: email
          nullable: true
          description: Correo electronico del usuario
          example: usuario@ejemplo.com
        avatar_url:
          type: string
          nullable: true
          description: URL de la foto de perfil o avatar del usuario
          example: https://avatars.githubusercontent.com/u/123456?v=4
        scopes:
          type: array
          items:
            type: string
          description: Permisos concedidos en esta sesion
          example: ["agent:run", "profile:read"]
      required: [subject, scopes]

    OAuthErrorResponse:
      type: object
      description: Respuesta de error compatible con RFC 6749 seccion 5.2
      properties:
        error:
          type: string
          description: Codigo de error maquina-legible
          example: invalid_grant
        error_description:
          type: string
          description: Descripcion legible del error
          example: Credenciales invalidas
        seconds_remaining:
          type: integer
          nullable: true
          description: Segundos restantes de bloqueo en caso de error account_locked o rate limit
          example: 300
      required: [error, error_description]

    # ── Projects ──

    CreateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Nombre del proyecto
          example: Mi Proyecto
        description:
          type: string
          maxLength: 2000
          default: ""
          description: Descripcion del proyecto
          example: Proyecto de ejemplo para KOSMO
      required: [name]

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          description: Identificador unico del proyecto (prj_ + ULID)
          example: prj_01HXYAZABCDEFGHIJKLMNOP
        name:
          type: string
          example: Mi Proyecto
        slug:
          type: string
          example: mi-proyecto
        description:
          type: string
          example: Proyecto de ejemplo para KOSMO
        owner_id:
          type: string
          example: usr_01HXYAZABCDEFGHIJKLMNOP
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, slug, description, owner_id, created_at, updated_at]

    # ── Discovery ──

    DiscoveryResponse:
      type: object
      properties:
        id:
          type: string
          example: doc_prj_01HXYAZABCDEFGHIJKLMNOP
        project_id:
          type: string
          example: prj_01HXYAZABCDEFGHIJKLMNOP
        content:
          type: string
          description: Contenido del documento en formato Markdown
      required: [id, project_id, content]

    SaveDiscoveryRequest:
      type: object
      properties:
        content:
          type: string
          description: Contenido del documento en formato Markdown
      required: [content]

    RefineDiscoveryRequest:
      type: object
      additionalProperties: false
      properties:
        instructions:
          type: string
          minLength: 1
          maxLength: 500
          description: Instrucciones de refinamiento para el agente IA
          example: Haz que la vision del producto sea mas concisa y enfocada en resultados.
      required: [instructions]

    # ── Features ──

    FeatureResponse:
      type: object
      properties:
        id:
          type: string
          description: Identificador unico de la caracteristica
          example: feat_01HXYAZABCDEFGHIJKLMNOP
        project_id:
          type: string
          example: prj_01HXYAZABCDEFGHIJKLMNOP
        number:
          type: integer
          example: 1
        title:
          type: string
          example: Gestion de catalogo de productos
        slug:
          type: string
          example: gestion-de-catalogo-de-productos
        description:
          type: string
          example: Permite a los usuarios administrar el catalogo de productos.
        origin:
          type: string
          example: Se deriva de la seccion Capacidades del descubrimiento.
        display_id:
          type: string
          example: C01
        warnings:
          type: array
          items:
            type: string
          description: Advertencias sobre solapamientos funcionales o inconsistencias menores
          default: []
      required: [id, project_id, number, title, slug, description, origin, display_id]

    FeatureSuggestionItem:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        origin:
          type: string
          default: ""
      required: [title, description]

    FeatureSuggestionResponse:
      type: object
      properties:
        number:
          type: integer
          example: 1
        title:
          type: string
          example: Modulo de facturacion electronica
        description:
          type: string
          example: Generacion y envio de comprobantes tributarios.
        origin:
          type: string
          example: Derivado de Reglas de Negocio en Descubrimiento.
      required: [number, title, description, origin]

    SaveSelectedFeaturesRequest:
      type: object
      properties:
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureSuggestionItem"
      required: [features]

    CreateCharacteristicRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50
          description: Titulo de la caracteristica (maximo 50 caracteres)
          example: Gestion de catalogo de productos
        description:
          type: string
          maxLength: 500
          default: ""
          description: Descripcion de la caracteristica (maximo 500 caracteres)
          example: Permite a los usuarios administrar el catalogo de productos.
        origin:
          type: string
          default: ""
          description: Origen y trazabilidad. Si se omite, la IA lo deriva.
      required: [title]

    EditFeatureManualRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50
          description: Nuevo titulo de la caracteristica
        description:
          type: string
          minLength: 0
          maxLength: 500
          description: Nueva descripcion de la caracteristica
      required: [title, description]

    CreateCharacteristicResult:
      type: object
      properties:
        is_saved:
          type: boolean
          description: True si la caracteristica fue guardada
        feature:
          $ref: "#/components/schemas/FeatureResponse"
          description: Presente solo si is_saved=true
        origin:
          type: string
        is_consistent:
          type: boolean
          description: False si se detecto contradiccion con el descubrimiento
        inconsistency_reason:
          type: string
          nullable: true
          description: Presente solo si is_saved=false por inconsistencia
        warnings:
          type: array
          items:
            type: string
          description: Advertencias sobre solapamientos funcionales o inconsistencias menores
          default: []
      required: [is_saved, origin, is_consistent]

    CheckConsistencyRequestView:
      type: object
      additionalProperties: false
      properties:
        content:
          type: object
          description: Contenido nuevo a validar contra el documento fuente
      required: [content]

    InconsistencyResultView:
      type: object
      properties:
        is_consistent:
          type: boolean
          description: False si se detecto contradiccion
        reason:
          type: string
          nullable: true
          description: Motivo de la inconsistencia
        conflicting_section:
          type: string
          nullable: true
          description: Seccion del documento fuente con conflicto
      required: [is_consistent]

    # ── Chat ──

    SendChatRequest:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Mensaje textual del usuario
        session_id:
          type: string
          nullable: true
          description: Hilo de conversacion (cht_ + ULID). Si se omite, contexto de la fase.
      required: [content]

    ChangeSuggestion:
      type: object
      description: Sugerencia de cambio generada por la IA
      properties:
        id:
          type: string
          description: ID de la sugerencia (chg_ + ULID)
        section:
          type: string
          description: Seccion del documento afectada
        description:
          type: string
          description: Descripcion corta del cambio propuesto
        diff_before:
          type: string
          description: Contenido actual de la seccion
        diff_after:
          type: string
          description: Contenido sugerido por la IA
        rationale:
          type: string
          nullable: true
          description: Justificacion del cambio propuesto
        applied:
          type: boolean
          default: true
          description: True si el servidor aplico el cambio al instante
        not_applied_reason:
          type: string
          nullable: true
          description: Razon por la que no se pudo aplicar
      required: [id, section, description, diff_before, diff_after, applied]

    ModificationResultView:
      type: object
      description: Resultado de la modificacion aplicada por el chat
      properties:
        applied:
          type: boolean
          description: True si la modificacion fue aplicada al documento
        modified_section:
          type: string
          nullable: true
          description: Nombre de la seccion o atributo modificado
        change_description:
          type: string
          nullable: true
          description: Descripcion breve del cambio aplicado
        modified_document:
          type: string
          nullable: true
          description: Markdown completo actualizado
        before:
          type: string
          nullable: true
          description: Contenido previo modificado
        after:
          type: string
          nullable: true
          description: Contenido posterior modificado
        undo_version_id:
          type: string
          nullable: true
          description: Version previa al cambio (reservado para undo)
        clarification_message:
          type: string
          nullable: true
          description: Mensaje solicitando detalle cuando la instruccion es ambigua
      required: [applied]

    RedirectInfoView:
      type: object
      description: Redireccion cuando el cambio pertenece a otra fase upstream
      properties:
        target_phase:
          type: string
          description: Fase destino del cambio
        redirect_message:
          type: string
          description: Explicacion de por que el cambio pertenece a esa fase
      required: [target_phase, redirect_message]

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          description: ID del mensaje
        role:
          type: string
          description: Rol del emisor (user, assistant, system)
        content:
          type: string
          description: Contenido del mensaje
        created_at:
          type: string
          format: date-time
        change_suggestions:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ChangeSuggestion"
        modification:
          $ref: "#/components/schemas/ModificationResultView"
      required: [id, role, content, created_at]

    ChatResponse:
      type: object
      description: Respuesta del chat con modificacion aplicada, consistencia o redireccion
      properties:
        message:
          $ref: "#/components/schemas/ChatMessage"
        modification:
          $ref: "#/components/schemas/ModificationResultView"
        redirect:
          $ref: "#/components/schemas/RedirectInfoView"
        consistency:
          type: array
          nullable: true
          items:
            type: object
          description: Impactos de consistencia en las fases downstream
      required: [message]

    ChatHistoryResponse:
      type: object
      properties:
        phase:
          type: string
        context:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        has_more:
          type: boolean
          default: false
        next_cursor:
          type: string
          nullable: true
      required: [phase, context, messages]

    ChatStreamEvent:
      oneOf:
        - type: object
          description: Inicio del stream
          properties:
            type:
              type: string
              const: start
          required: [type]
        - type: object
          description: Fragmento de texto en tiempo real
