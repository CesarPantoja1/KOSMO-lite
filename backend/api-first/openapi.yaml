                $ref: "#/components/schemas/ChatHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/features/{feature_id}/chat/stream:
    post:
      tags: [features]
      summary: Enviar mensaje al chat de Caracteristicas con streaming SSE
      description: Genera respuesta en tiempo real (SSE). Emite eventos start, chunk y message.
      operationId: feature_chat_stream
      parameters:
        - $ref: "#/components/parameters/FeatureId"
        - $ref: "#/components/parameters/ProjectIdRateLimitQuery"
      requestBody:
        required: true
