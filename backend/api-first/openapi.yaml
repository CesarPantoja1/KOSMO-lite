        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequirementsRequest"
      responses:
        "200":
          description: Requisitos generados exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateRequirementsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
