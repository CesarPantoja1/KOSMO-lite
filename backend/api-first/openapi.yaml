        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRequirementsRequest"
      responses:
        "200":
          description: Requisitos guardados exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature_id:
                    type: string
                  message:
                    type: string
                    example: ok
                required: [feature_id, message]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [requirements]
      summary: Eliminar requisitos
      description: Elimina el documento de requisitos EARS de la caracteristica especificada.
      operationId: requirements_delete
