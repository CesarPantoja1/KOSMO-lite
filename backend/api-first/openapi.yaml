          type: integer
          description: Analisis fallidos
      required: [pending, evaluating, failed]

    ConsistencyStatusView:
      type: object
      properties:
        phases:
          type: object
          properties:
            features:
              $ref: "#/components/schemas/ConsistencyPhaseCounts"
            requirements:
              $ref: "#/components/schemas/ConsistencyPhaseCounts"
            model:
              $ref: "#/components/schemas/ConsistencyPhaseCounts"
          required: [features, requirements, model]
      required: [phases]

    ReviewCardDiff:
      type: object
      properties:
        field:
          type: string
        before:
          type: string
        after:
          type: string
      required: [field, before, after]

    ReviewCardView:
      type: object
      properties:
        evaluation_id:
          type: string
        source_phase:
          type: string
        target_phase:
          type: string
        target_artifact_id:
          type: string
        artifact_type:
          type: string
        target_display_id:
          type: string
        target_title:
          type: string
        section:
          type: string
        rationale:
          type: string
        action:
          type: string
          enum: [update, delete, keep, create]
        diff:
          $ref: "#/components/schemas/ReviewCardDiff"
        status:
          type: string
          enum: [evaluating, completed, failed]
        failure_reason:
          type: string
          nullable: true
      required: [evaluation_id, source_phase, target_phase, target_artifact_id, artifact_type, status]

    ConsistencyReviewView:
      type: object
      properties:
