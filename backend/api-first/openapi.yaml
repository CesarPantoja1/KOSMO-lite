          type: string
        applied:
          type: boolean
        discarded:
          type: boolean
        target_id:
          type: string
        project_id:
          type: string
      required: [evaluation_id, project_id]

    BulkResolveRequestView:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [apply, discard]
          description: Accion a ejecutar (apply | discard)
        target_phase:
          type: string
          enum: [features, requirements, model, implementation]
          description: Fase destino a resolver
      required: [action, target_phase]

    BulkResolveResponse:
      type: object
      properties:
        resolved:
          type: integer
          description: Numero de sugerencias resueltas
        skipped:
          type: integer
          description: Numero de sugerencias omitidas
      required: [resolved, skipped]

    ActivityItemView:
      type: object
      properties:
        evaluation_id:
          type: string
        status:
          type: string
          enum: [applied, discarded]
        source_phase:
          type: string
        target_phase:
          type: string
        target_artifact_id:
          type: string
        target_title:
          type: string
        failure_reason:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
      required: [evaluation_id, status, source_phase, target_phase, target_artifact_id]

    ConsistencyActivityView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItemView"
      required: [items]

    ChangeInputView:
      type: object
      properties:
        section:
          type: string
        diff_before:
          type: string
        diff_after:
          type: string
        description:
          type: string
          default: ""
      required: [section, diff_before, diff_after]

    EvaluateConsistencyRequestView:
      type: object
      additionalProperties: false
      properties:
        phase_origin:
          type: string
          description: Fase de origen (discovery, features, requirements, model)
        phase_destination:
          type: string
          nullable: true
          description: Fase destino downstream a evaluar
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeInputView"
      required: [phase_origin, changes]

    ImpactItemView:
      type: object
      properties:
        id:
          type: string
        phase:
          type: string
        targetId:
          type: string
        artifact_type:
          type: string
        targetDisplayId:
          type: string
        targetTitle:
          type: string
        section:
          type: string
          default: ""
        rationale:
          type: string
          default: ""
        diff:
          type: object
          nullable: true
        action:
          type: string
          default: update
      required: [id, phase, targetId, artifact_type]

    ConsistencyReportView:
      type: object
      properties:
        report_id:
          type: string
          description: ID del reporte (cnr_ + ULID)
        source_type:
          type: string
        source_id:
          type: string
        your_changes:
          type: array
          items:
            type: object
            properties:
              change_id:
                type: string
              section:
                type: string
              description:
                type: string
              diff:
                type: object
                properties:
                  before:
                    type: string
                  after:
                    type: string
              accepted:
                type: boolean
            required: [change_id, section, diff, accepted]
        upstream_impact:
          type: array
          items:
            $ref: "#/components/schemas/ImpactItemView"
        downstream_impact:
          type: array
          items:
            $ref: "#/components/schemas/ImpactItemView"
      required: [report_id, source_type, source_id, your_changes, upstream_impact, downstream_impact]

    ConsistencyStreamEvent:
      oneOf:
        - type: object
          description: Progreso de evaluacion
          properties:
            type:
              type: string
              const: progress
            message:
              type: string
          required: [type, message]
        - type: object
          description: Reporte final
          properties:
            type:
              type: string
              const: report
            report:
              $ref: "#/components/schemas/ConsistencyReportView"
          required: [type, report]

    ApplyImpactsRequestView:
      type: object
      additionalProperties: false
      properties:
        impacts:
          type: array
          items:
            type: object
            description: Diccionario con los datos del impacto a aplicar
      required: [impacts]

    ApplyImpactsResponse:
      type: object
      properties:
        applied:
          type: array
          items:
            type: object
            properties:
              target_id:
                type: string
              artifact_type:
                type: string
            required: [target_id, artifact_type]
        failed:
          type: array
          items:
            type: object
            properties:
              target_id:
                type: string
              artifact_type:
                type: string
              reason:
                type: string
            required: [target_id, artifact_type, reason]
      required: [applied, failed]

    # ── Documents ──

    DocumentModifyRequestView:
      type: object
      additionalProperties: false
      properties:
        document_type:
          type: string
          enum: [discovery, features, requirements, model]
          description: Tipo de documento a modificar
        document_id:
          type: string
          description: ID del documento o caracteristica a modificar
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
          description: Instruccion textual del cambio deseado
      required: [document_type, document_id, instruction]

    DocumentModifyResponseView:
      type: object
      properties:
        document_id:
          type: string
          description: ID del documento modificado
        content:
          type: string
          description: Contenido completo del documento actualizado
        highlighted_section:
          type: string
          nullable: true
          description: Nombre de la seccion modificada
        message:
          type: string
          description: Mensaje de confirmacion
      required: [document_id, content, message]

    RevertDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
        version_id:
          type: string
      required: [project_id, version_id]

    # ── Traceability ──

    TraceabilityNavigationOutputView:
      type: object
      properties:
        permitted:
          type: boolean
          description: Indica si la edicion esta permitida en este nivel
        redirect_message:
          type: string
          nullable: true
          description: Mensaje para mostrar al usuario si no esta permitido
        source_entity_name:
          type: string
          nullable: true
          description: Nombre de la entidad de origen
        source_entity_id:
          type: string
          nullable: true
          description: ID de la entidad de origen
        source_level:
          type: string
          nullable: true
          description: Fase de la entidad de origen
      required: [permitted]

    # ── MCP Tools ──

    MCPToolRequest:
      type: object
      properties:
        feature_id:
          type: string
          minLength: 1
          description: Identificador de la caracteristica
      required: [feature_id]

    MCPToolResponse:
      type: object
      properties:
        feature_id:
          type: string
        content:
          type: string
      required: [feature_id, content]

    # ── Implementations (Codegen) ──

    GenerateImplementationRequest:
      type: object
      properties:
        feature_id:
          type: string
          description: ID de la caracteristica a implementar
        max_retries:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: Numero maximo de reintentos
      required: [feature_id]

    GenerateImplementationResponse:
      type: object
      properties:
        implementation_id:
          type: string
          description: ID del proceso iniciado para consumir sus eventos
      required: [implementation_id]

    ImplementationFileContentResponse:
      type: object
      properties:
        path:
          type: string
          description: Ruta relativa del archivo solicitado
        content:
          type: string
          description: Contenido del archivo en texto plano
      required: [path, content]

    ImplementationRecordResponse:
      type: object
      description: Registro persistido de una implementacion (fuente de verdad para el frontend)
      properties:
        implementation_id:
          type: string
          description: ID de la implementacion
        feature_id:
          type: string
          description: ID de la caracteristica implementada
        project_id:
          type: string
          description: ID del proyecto al que pertenece la caracteristica
        status:
          type: string
          description: Estado actual de la implementacion
        generated_files:
          type: array
          items:
            type: string
          default: []
          description: Archivos generados en el workspace
        features_count:
          type: integer
          default: 1
          description: Cantidad de caracteristicas implementadas
        screens_count:
          type: integer
          default: 0
          description: Cantidad de pantallas y componentes generados
        requirements_count:
          type: integer
          default: 0
          description: Cantidad de requisitos de negocio cubiertos
        validations_passed:
          type: integer
          default: 0
          description: Pasos de validacion exitosos
        validations_total:
          type: integer
          default: 0
          description: Total de pasos de validacion
        traceability_edges_count:
          type: integer
          default: 0
          description: Total de aristas de trazabilidad registradas
        technologies:
          type: array
          items:
            type: string
          default: []
          description: Tecnologias principales del proyecto
        updated_at:
          type: string
          format: date-time
          description: Ultima actualizacion del registro
      required: [implementation_id, feature_id, project_id, status, updated_at]

    # ── Validación Efímera (HU-23 CA-05 / Codegen) ──

    ValidationStepResultResponse:
      type: object
      description: Resultado de la ejecución de un paso del pipeline de validación determinística
      properties:
        step:
          type: string
          description: Identificador del paso ejecutado (typecheck, lint, tests, build)
          example: typecheck
        success:
          type: boolean
          description: Indica si el paso concluyó satisfactoriamente sin errores
          example: true
        duration_ms:
          type: integer
          description: Duración de ejecución del paso en milisegundos
          example: 1420
        exit_code:
          type: integer
          description: Código de salida retornado por el proceso en el contenedor efímero
          example: 0
        error_messages:
          type: array
          items:
            type: string
          default: []
          description: Mensajes de error estructurados extraídos de la salida estándar o error
          example: []
      required: [step, success, duration_ms, exit_code, error_messages]

    ValidateWorkspaceResponse:
      type: object
      description: Resultado integral del pipeline de validación en contenedor efímero
      properties:
        all_passed:
          type: boolean
          description: Indica si la totalidad de pasos de compilación y pruebas fueron exitosos
          example: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ValidationStepResultResponse"
          description: Detalle de ejecución de cada uno de los pasos de validación
        failed_step:
          type: string
          nullable: true
          description: Nombre del primer paso que falló en caso de validación no exitosa
          example: null
        error_summary:
          type: array
          items:
            type: string
          default: []
          description: Resumen de errores consolidados para diagnóstico o retroalimentación a la IA
          example: []
        total_duration_ms:
          type: integer
          description: Duración total acumulada de la validación en milisegundos
          example: 4530
      required: [all_passed, steps, total_duration_ms]

    # ── AI Configuration (HU-25 BYOK) ──

    AIProviderEnum:
      type: string
      enum: [openai, anthropic, google, deepseek, custom, kosmo_default]
      description: Identificador del proveedor de Inteligencia Artificial
      example: anthropic

    AIModelInfoResponse:
      type: object
      description: Información de un modelo de IA soportado por un proveedor
      properties:
        id:
           type: string
           description: Identificador del modelo para invocación de API
           example: claude-3-5-sonnet-20241022
        display_name:
           type: string
           description: Nombre legible del modelo para la interfaz de usuario
           example: Claude 3.5 Sonnet
        tier:
           type: string
           description: Nivel de capacidad o propósito del modelo (ej. fast, premium, reasoning)
           example: premium
      required: [id, display_name, tier]

    AIProviderInfoResponse:
      type: object
      description: Información de un proveedor de IA y sus modelos disponibles
      properties:
        value:
           type: string
           description: Identificador único del proveedor (anthropic, openai, google, deepseek)
           example: anthropic
        label:
           type: string
           description: Nombre legible del proveedor para la interfaz
           example: Anthropic
        models:
           type: array
           items:
             $ref: "#/components/schemas/AIModelInfoResponse"
           description: Lista de modelos soportados por el proveedor
      required: [value, label, models]

    AIConfigResponse:
      type: object
      description: Estado y configuración del proveedor de IA del usuario
      properties:
        provider:
          $ref: "#/components/schemas/AIProviderEnum"
        model:
          type: string
          description: Nombre del modelo de IA configurado
          example: claude-3-5-sonnet-20241022
        is_custom:
          type: boolean
          description: True si el usuario utiliza su propia clave de acceso; False si opera con el modelo predeterminado de KOSMO
          example: true
        has_api_key:
          type: boolean
          description: Indica si existe una clave de API guardada y cifrada en el sistema
          example: true
        masked_key:
          type: string
          nullable: true
          description: Clave enmascarada preservando únicamente los últimos cuatro caracteres para identificación visual
          example: "••••••••1234"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Marca temporal ISO-8601 UTC de la última modificación de la configuración
          example: "2026-08-20T15:30:00Z"
      required: [provider, model, is_custom, has_api_key]

    SaveAIConfigRequest:
      type: object
      additionalProperties: false
      description: Payload para guardar o actualizar la configuración del proveedor de IA
      properties:
        provider:
          $ref: "#/components/schemas/AIProviderEnum"
        model:
          type: string
          minLength: 1
          maxLength: 100
          description: Identificador del modelo soportado por el proveedor
          example: claude-3-5-sonnet-20241022
        api_key:
          type: string
          minLength: 1
          maxLength: 500
          description: Clave secreta de API del proveedor (se cifra simétricamente con Fernet)
          example: "sk-ant-api03-abcdef1234567890"
      required: [provider, model, api_key]

    TestAIConnectionRequest:
      type: object
      additionalProperties: false
      description: Payload para probar la conectividad y validez de credenciales con el proveedor de IA
      properties:
        provider:
          $ref: "#/components/schemas/AIProviderEnum"
        model:
          type: string
          minLength: 1
          maxLength: 100
          description: Modelo a verificar con el proveedor
          example: claude-3-5-sonnet-20241022
        api_key:
          type: string
          minLength: 1
          maxLength: 500
          nullable: true
          description: Clave de API a verificar. Si se omite, se prueba con la clave actualmente persistida del usuario.
          example: "sk-ant-api03-abcdef1234567890"
      required: [provider, model]

    TestAIConnectionResponse:
      type: object
      description: Respuesta cualitativa de la verificación de conexión con el proveedor de IA
      properties:
        is_connected:
          type: boolean
          description: True si la conexión y autenticación con la API del proveedor fueron exitosas
          example: true
        detected_model:
          type: string
          description: Identificador del modelo confirmado por el proveedor externo
          example: claude-3-5-sonnet-20241022
        message:
          type: string
          description: Mensaje descriptivo del resultado de la prueba
          example: "Conexión exitosa con Anthropic. Modelo claude-3-5-sonnet-20241022 verificado y listo."
      required: [is_connected, detected_model, message]

    # ── Integrations (OAuth) ──

    IntegrationProviderEnum:
      type: string
      enum: [github, railway]
      description: Identificador de la plataforma externa para integración
      example: github

    ConnectOAuthRequest:
      type: object
      additionalProperties: false
      description: Payload para intercambiar el código temporal de OAuth por credenciales de acceso
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 500
          description: Código de autorización temporal devuelto por el proveedor OAuth
          example: "gho_16C7e42F292c6912E7710c838347Ae178B4a"
        redirect_uri:
          type: string
          nullable: true
          description: URI de redirección utilizada durante el flujo de autorización
          example: "http://localhost:3000/settings"
        code_verifier:
          type: string
          nullable: true
          minLength: 43
          maxLength: 128
          description: Verificador PKCE generado por el navegador para este intercambio OAuth
          example: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      required: [code]

    IntegrationStatusResponse:
      type: object
      description: Estado de vinculación de una plataforma externa con la cuenta de usuario
      properties:
        provider:
          $ref: "#/components/schemas/IntegrationProviderEnum"
        is_connected:
          type: boolean
          description: True si la cuenta de usuario se encuentra vinculada activamente con la plataforma
          example: true
        username:
          type: string
          nullable: true
          description: Nombre de usuario o identificador público en la plataforma externa
          example: "octocat"
        connected_at:
          type: string
          format: date-time
          nullable: true
          description: Marca de tiempo ISO-8601 UTC de la vinculación
          example: "2026-08-19T10:00:00Z"
      required: [provider, is_connected]

    # ── GitHub Sync (HU-23) ──

    GitHubSyncStatusEnum:
      type: string
      enum: [not_created, created, syncing, synced, failed]
      description: Estado del ciclo de vida y sincronización del repositorio remoto
      example: synced

    ProjectGitHubResponse:
      type: object
      description: Metadatos de vinculación y sincronización con GitHub para un proyecto
      properties:
        has_repository:
          type: boolean
          description: True si el proyecto ya cuenta con un repositorio remoto creado en GitHub
          example: true
        repo_name:
          type: string
          nullable: true
          description: Nombre del repositorio remoto en GitHub
          example: "kosmo-gestion-inventarios"
        repo_url:
          type: string
          nullable: true
          description: URL pública o accesible del repositorio en GitHub
          example: "https://github.com/octocat/kosmo-gestion-inventarios"
        is_public:
          type: boolean
          nullable: true
          description: Visibilidad del repositorio (True = público)
          example: true
        last_push_at:
          type: string
          format: date-time
          nullable: true
          description: Marca de tiempo ISO-8601 UTC del último envío exitoso de código
          example: "2026-08-22T18:45:00Z"
        last_commit_hash:
          type: string
          nullable: true
          description: Hash SHA-1 del último commit sincronizado con el repositorio remoto
          example: "7f4b82d3e91a0c5b6e8f4a1c3d5e7b9a2f1e4c6a"
        sync_status:
          $ref: "#/components/schemas/GitHubSyncStatusEnum"
        suggested_repo_name:
          type: string
          nullable: true
          description: Nombre de repositorio sugerido normalizado (ej. kosmo-{slug}) si aún no existe
          example: "kosmo-gestion-inventarios"
        error_message:
          type: string
          nullable: true
          description: Detalle del error en caso de fallo en la sincronización
          example: null
      required: [has_repository, sync_status]

    PushGitHubRequest:
      type: object
      additionalProperties: false
      description: Payload para solicitar la creación de repositorio o push incremental de código
      properties:
        repo_name:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
          description: Nombre deseado para el repositorio. Obligatorio si el repositorio aún no existe.
          example: "kosmo-gestion-inventarios"
        is_public:
          type: boolean
          default: true
          description: Visibilidad del repositorio (siempre público; no se permiten repositorios privados)
          example: true
        commit_message:
          type: string
          maxLength: 300
          nullable: true
          description: Mensaje descriptivo para el commit de sincronización
          example: "feat: implementar autenticación y modelo de datos"
      required: []

    # ── Deploy Railway (HU-24) ──

    DeployStatusEnum:
      type: string
      enum: [idle, pending, building, ready, failed]
      description: Estado del ciclo de vida del despliegue en la plataforma en la nube
      example: ready

    ProjectDeployStatusResponse:
      type: object
      description: Metadatos y estado actual de la publicación del proyecto en la nube
      properties:
        service_id:
          type: string
          nullable: true
          description: Identificador único del servicio en Railway
          example: "srv_01HTXYZ9876543210ABC"
        service_name:
          type: string
          nullable: true
          description: Nombre del servicio desplegado en la plataforma
          example: "kosmo-gestion-inventarios"
        deploy_url:
          type: string
          nullable: true
          description: URL pública accesible en internet generada por Railway
          example: "https://kosmo-gestion-inventarios.up.railway.app"
        status:
          $ref: "#/components/schemas/DeployStatusEnum"
        last_deploy_at:
          type: string
          format: date-time
          nullable: true
          description: Marca de tiempo ISO-8601 UTC del último despliegue disparado
          example: "2026-08-22T19:00:00Z"
        error_message:
          type: string
          nullable: true
          description: Mensaje de error si la construcción o arranque del servicio fallaron
          example: null
        error_log_url:
          type: string
          nullable: true
          description: Enlace directo hacia la consola de registros de compilación en Railway
          example: "https://railway.com/project/prj-123/service/srv-456/logs"
      required: [status]

    DeployRailwayRequest:
      type: object
      additionalProperties: false
      description: Parámetros opcionales para configurar o personalizar el despliegue en Railway
      properties:
        service_name:
          type: string
          maxLength: 100
          nullable: true
          description: Nombre personalizado para el servicio en Railway
          example: "kosmo-gestion-inventarios"
        environment_variables:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Variables de entorno adicionales a configurar en el servicio
          example:
            NODE_ENV: "production"
            LOG_LEVEL: "info"
      required: []

    SpecPhase:
      type: string
      enum:
        - descubrimiento
        - caracteristicas
        - requisitos
        - modelo
        - implementacion
      description: Fase del ciclo de vida Spec-Driven Development (SDD)

    CodeChallengeMethod:
      type: string
      enum: [S256]
      description: Método de transformación para PKCE (RFC 7636)

    GrantType:
      type: string
      enum: [authorization_code]
      description: Tipo de concesión OAuth 2.0 para intercambio de código (RFC 6749)

    RefreshGrantType:
      type: string
      enum: [refresh_token]
      description: Tipo de concesión OAuth 2.0 para refresco de token (RFC 6749)
