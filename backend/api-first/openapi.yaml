openapi: 3.1.0
info:
  title: KOSMO API
  version: "v1"
  description: >-
    API de KOSMO - plataforma low-code de spec-driven development (SDD) asistida por IA.
    Ciclo completo: Descubrimiento -> Características -> Requisitos -> Modelo -> Código.

    Convenciones:
    - Autenticación PKCE (RFC 7636) con JWT RS256 (bearerAuth).
    - Errores RFC 7807 (application/problem+json) con type URN, trace_id y violations, o OAuthErrorResponse (RFC 6749) / HttpErrorResponse.
    - Fechas ISO-8601 UTC con sufijo Z.
    - Las fases siguen el orden Descubrimiento -> Características -> Requisitos -> Modelo -> Código.
      La consistencia se evalúa exclusivamente hacia la derecha (downstream).
  contact:
    name: Equipo KOSMO
    email: dev@kosmo.app
    url: https://github.com/CesarPantoja1/KOSMO
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local — desarrollo en máquina del programador
  - url: https://api-dev.kosmo.app
    description: Desarrollo — entorno de integración continua
  - url: https://api.kosmo.app
    description: Producción — tráfico real de usuarios

tags:
  - name: health
    description: Verificación de disponibilidad del servidor
  - name: auth
    description: Flujo de autenticación PKCE + OAuth 2.0 (RFC 6749/7636) con JWT RS256
  - name: projects
    description: Gestión del ciclo de vida de proyectos
  - name: discovery
    description: Fase de Descubrimiento — documento de visión de producto
  - name: features
    description: Fase de Características funcionales del producto software
  - name: requirements
    description: Fase de Requisitos (EARS) por característica
  - name: modelo
    description: Fase de Modelo — diagramas de actividad PlantUML
  - name: consistency
    description: Evaluación y resolución de consistencia downstream entre fases (gate)
  - name: chat-sessions
    description: Gestión de sesiones e hilos de chat interactivo por fase
  - name: documents
    description: Modificación directa y versionado/reversión de documentos
  - name: schemas
    description: Introspección de esquemas JSON para formularios dinámicos
  - name: knowledge
    description: Consolidación y gestión de patrones de conocimiento cross-project
  - name: Traceability
    description: Navegación y guardas de trazabilidad entre entidades y fases
  - name: MCP Tools
    description: Herramientas de contexto para agentes de código bajo protocolo MCP
  - name: Implementations
    description: Generación y consulta de código fuente / implementaciones vía OpenCode
  - name: ai_config
    description: Configuración y verificación del proveedor de Inteligencia Artificial (BYOK)
  - name: integrations
    description: Gestión de vinculación OAuth con plataformas externas (GitHub, Railway)
  - name: github
    description: Sincronización y subida de código fuente a repositorios de GitHub
  - name: deploy
    description: Orquestación y monitoreo del despliegue en la nube (Railway)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: >-
        Verificacion de disponibilidad del servidor. Devuelve status ok si el proceso esta activo.
      operationId: health_check
      security: []
      responses:
        "200":
          description: Servidor activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /metrics:
    get:
      summary: Metrics
      description: Endpoint that serves Prometheus metrics.
      operationId: metrics_metrics_get
      security: []
      responses:
        "200":
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string

  # ══════════════════════════════ AUTH ══════════════════════════════

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Registrar nuevo usuario
      description: >-
        Crea una nueva cuenta de usuario en KOSMO. La contrasena se procesa con Argon2id (OWASP 2025).
        Si el email ya existe se devuelve 409 Conflict. Limite de velocidad: 3 peticiones / IP / ventana.
      operationId: auth_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Confirmacion generica de registro (mitiga enumeracion de usuarios CWE-204)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Datos de registro invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
        "429":
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  /api/v1/auth/authorize:
    post:
      tags: [auth]
      summary: Iniciar autenticacion PKCE — obtener codigo de autorizacion
      description: >-
        Valida las credenciales del usuario e inicia el flujo PKCE. Emite un authorization_code
        de un solo uso (TTL: 5 min) vinculado al code_challenge enviado. Tras 5 intentos fallidos
        consecutivos se responde con 429 y header Retry-After. Limite: 10 peticiones / IP / ventana.
      operationId: auth_authorize
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "201":
          description: Codigo de autorizacion emitido. Usar en POST /token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationCodeResponse"
        "401":
          description: Credenciales invalidas (email no encontrado o contrasena incorrecta)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
        "429":
          description: Cuenta bloqueada por intentos fallidos excesivos
          headers:
            Retry-After:
              schema:
                type: string
              description: Segundos restantes de bloqueo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
              example:
                error: account_locked
                error_description: "Cuenta bloqueada. Intente de nuevo en 300 segundos."
                seconds_remaining: 300

  /api/v1/auth/token:
    post:
      tags: [auth]
      summary: Intercambiar codigo de autorizacion por par de tokens JWT
      description: >-
        Completa el flujo PKCE: valida el code_verifier contra el code_challenge almacenado,
        consume el authorization_code y emite un par de tokens JWT firmados con RS256 (access TTL 15m, refresh TTL 7d).
        Limite: 5 peticiones / IP / ventana.
      operationId: auth_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
      responses:
        "200":
          description: Par de tokens emitido exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          description: Codigo invalido, expirado, consumido o code_verifier no coincide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
        "429":
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Renovar par de tokens usando refresh token
      description: >-
        Implementa Token Rotation: consume el refresh token presentado, lo revoca en Redis y emite un par nuevo.
        Si se detecta reutilizacion, toda la familia de tokens queda revocada. Limite: 30 peticiones / IP / ventana.
      operationId: auth_refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Par de tokens renovado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          description: Refresh token invalido, expirado, revocado o reutilizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
        "429":
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Obtener identidad del usuario autenticado
      description: >-
        Decodifica y verifica el access_token del header Authorization: Bearer.
        Devuelve el subject (ID de usuario) y los scopes de la sesion activa.
      operationId: auth_me
      responses:
        "200":
          description: Identidad verificada del token presentado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalView"
        "401":
          description: Token ausente, mal formado, con firma invalida, expirado o revocado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesion y revocar tokens activos
      description: >-
        Revoca el access_token del header Authorization: Bearer y opcionalmente el refresh_token del body.
        Ambos quedan invalidados en Redis. Limite: 20 peticiones / IP / ventana.
      operationId: auth_logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Sesion cerrada exitosamente. Sin cuerpo de respuesta.
        "401":
          description: Token ausente, mal formado, expirado o ya revocado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
        "429":
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  # ══════════════════════════════ PROJECTS ══════════════════════════════

  /api/v1/projects:
    post:
      tags: [projects]
      summary: Crear nuevo proyecto
      description: >-
        Crea un nuevo proyecto en KOSMO. El nombre se transforma automaticamente en un slug unico.
        Requiere autenticacion mediante Bearer token.
      operationId: project_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Proyecto creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [projects]
      summary: Listar proyectos del usuario
      description: Devuelve todos los proyectos del usuario autenticado. Requiere Bearer token.
      operationId: project_list
      responses:
        "200":
          description: Lista de proyectos del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects/{project_id}:
    get:
      tags: [projects]
      summary: Obtener proyecto por ID
      description: Devuelve los detalles de un proyecto especifico. Requiere Bearer token.
      operationId: project_get
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Detalles del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      summary: Eliminar proyecto
      description: >-
        Elimina el proyecto y todos sus artefactos en cascada global: servicio y despliegue
        en Railway, repositorio remoto en GitHub, workspace local de codigo, descubrimiento,
        caracteristicas, requisitos, modelos, chat y evaluaciones de consistencia. Requiere Bearer token.
      operationId: project_delete
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Proyecto eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  project_id:
                    type: string
                required: [status, project_id]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"


  # ══════════════════════════════ DISCOVERY ══════════════════════════════

  /api/v1/projects/{project_id}/discovery:
    post:
      tags: [discovery]
      summary: Generar documento de descubrimiento con IA
      description: Genera un documento de vision de producto estructurado en 8 secciones mediante IA.
      operationId: discovery_generate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Documento generado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [discovery]
      summary: Obtener documento de descubrimiento
      description: Devuelve el documento de descubrimiento almacenado de un proyecto.
      operationId: discovery_get
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Documento de descubrimiento del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [discovery]
      summary: Guardar documento de descubrimiento
      description: Persiste manualmente un documento de descubrimiento sin invocar al agente IA.
      operationId: discovery_save
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDiscoveryRequest"
      responses:
        "200":
          description: Documento guardado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects/{project_id}/discovery/refine:
    post:
      tags: [discovery]
      summary: Refinar documento de descubrimiento con IA
      description: >-
        Refina el documento de descubrimiento aplicando las instrucciones del usuario mediante IA.
        Las instrucciones no pueden superar los 500 caracteres.
      operationId: discovery_refine
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineDiscoveryRequest"
      responses:
        "200":
          description: Documento refinado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "400":
          description: Las instrucciones exceden los 500 caracteres o son invalidas
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Error al invocar el servicio de IA
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/discovery/chat:
    post:
      tags: [discovery]
      summary: Enviar mensaje al chat de Descubrimiento (aplicacion instantanea)
      description: >-
        Procesa el mensaje y aplica el cambio inmediatamente sobre el documento cuando corresponde,
        verificando consistencia downstream. Si corresponde a otra fase, devuelve redireccion.
      operationId: discovery_chat_send
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Mensaje procesado, modificacion aplicada o redireccion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Error de validacion o tamano de mensaje
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflicto de transicion de fase
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Error al invocar el LLM
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      tags: [discovery]
      summary: Obtener historial de chat de Descubrimiento
      description: Devuelve los mensajes del chat interactivo para la fase de Descubrimiento.
      operationId: discovery_chat_history
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CursorBefore"
        - $ref: "#/components/parameters/SessionIdQuery"
      responses:
        "200":
          description: Historial obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/discovery/chat/stream:
    post:
      tags: [discovery]
      summary: Enviar mensaje al chat de Descubrimiento con streaming SSE
      description: Genera respuesta en tiempo real (SSE). Emite eventos start, chunk y message.
      operationId: discovery_chat_stream
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Stream de eventos SSE
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  # ══════════════════════════════ FEATURES ══════════════════════════════

  /api/v1/projects/{project_id}/features:
    post:
      tags: [features]
      summary: Generar caracteristicas del producto con IA
      description: Genera caracteristicas de alto nivel evaluando el documento de descubrimiento del proyecto.
      operationId: features_generate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Caracteristicas generadas exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [features]
      summary: Listar caracteristicas del proyecto
      description: Devuelve todas las caracteristicas asociadas a un proyecto.
      operationId: features_list
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Lista de caracteristicas del proyecto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects/{project_id}/features/suggest:
    post:
      tags: [features]
      summary: Sugerir nuevas caracteristicas con IA
      description: Sugiere caracteristicas adicionales basadas en el documento de descubrimiento evitando duplicados.
      operationId: features_suggest
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Sugerencias de caracteristicas generadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureSuggestionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/projects/{project_id}/features/manual:
    post:
      tags: [features]
      summary: Crear caracteristica manualmente
      description: >-
        Crea una nueva caracteristica. Si no se indica origin, la IA lo deriva del descubrimiento
        y verifica coherencia. Ante inconsistencia devuelve is_saved=false con la razon.
      operationId: features_create_manual
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacteristicRequest"
      responses:
        "200":
          description: Caracteristica creada exitosamente o rechazada por inconsistencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCharacteristicResult"
        "400":
          description: Datos invalidos (titulo vacio o excesivo, descripcion muy larga)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/projects/{project_id}/features/{feature_id}/manual:
    put:
      tags: [features]
      summary: Editar caracteristica manualmente
      description: >-
        Edita una caracteristica existente. Si los cambios contradicen flagrantemente el descubrimiento,
        el guardado es rechazado devolviendo 409 Conflict.
      operationId: features_edit_manual
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditFeatureManualRequest"
      responses:
        "200":
          description: Caracteristica editada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contradiccion detectada con el documento fuente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/projects/{project_id}/features/save:
    post:
      tags: [features]
      summary: Guardar caracteristicas seleccionadas
      description: Guarda las caracteristicas seleccionadas por el usuario desde las sugerencias de la IA.
      operationId: features_save_selected
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSelectedFeaturesRequest"
      responses:
        "201":
          description: Caracteristicas guardadas exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects/{project_id}/features/{feature_id}:
    delete:
      tags: [features]
      summary: Eliminar caracteristica
      description: Elimina una caracteristica y todos sus artefactos asociados (requisitos, diagramas).
      operationId: features_delete
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FeatureId"
      responses:
        "200":
          description: Caracteristica eliminada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  feature_id:
                    type: string
                required: [status, feature_id]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/features/{feature_id}/consistency/check:
