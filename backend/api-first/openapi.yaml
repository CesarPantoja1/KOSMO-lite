            application/json:
              schema:
                $ref: "#/components/schemas/InconsistencyResultView"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════ FEATURE CHAT ══════════════════════════════

  /api/v1/features/{feature_id}/chat:
    post:
      tags: [features]
