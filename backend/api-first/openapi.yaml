        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Requisitos eliminados exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  feature_id:
                    type: string
                required: [status, feature_id]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/features/{feature_id}/requirements/refine:
    post:
      tags: [requirements]
      summary: Refinar requisitos EARS con IA
      description: >-
        Refina los requisitos de una caracteristica aplicando las instrucciones del usuario.
        Requiere que la caracteristica ya tenga requisitos generados.
      operationId: requirements_refine
      parameters:
        - $ref: "#/components/parameters/FeatureId"
        - $ref: "#/components/parameters/ProjectIdRateLimitQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineRequirementsRequest"
      responses:
        "200":
          description: Requisitos refinados exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefineRequirementsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/features/{feature_id}/requirements/regenerate:
    post:
      tags: [requirements]
      summary: Regenerar requisitos EARS con IA
      description: >-
        Regenera los requisitos de una caracteristica a partir del estado actual de la caracteristica padre,
        manteniendo la estructura EARS y criterios de aceptacion Dado-Cuando-Entonces.
      operationId: requirements_regenerate
      parameters:
        - $ref: "#/components/parameters/FeatureId"
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Requisitos regenerados exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateRequirementsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

