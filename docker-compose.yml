# KOSMO local development stack.
#
# Services:
# - frontend: Next.js + Bun
# - backend: FastAPI + uvicorn
# - opencode: servidor headless OpenCode para generación de código
# - postgres: pgvector/Postgres for relational data and vector support
# - redis: auth/session/rate-limit cache

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kosmo-frontend:dev
    container_name: kosmo-frontend
    init: true
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-KOSMO}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      NEXT_PUBLIC_AUTH_DISABLED: ${NEXT_PUBLIC_AUTH_DISABLED:-false}
      NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-${GITHUB_CLIENT_ID:-}}
      NEXT_PUBLIC_GITHUB_SCOPES: ${NEXT_PUBLIC_GITHUB_SCOPES:-repo}
      NEXT_PUBLIC_RAILWAY_CLIENT_ID: ${NEXT_PUBLIC_RAILWAY_CLIENT_ID:-${RAILWAY_CLIENT_ID:-}}
      NEXT_PUBLIC_RAILWAY_SCOPES: ${NEXT_PUBLIC_RAILWAY_SCOPES:-openid email profile offline_access workspace:admin}
      NEXT_PUBLIC_DOMAIN_APP: ${NEXT_PUBLIC_DOMAIN_APP:-http://localhost:3000}
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    command: sh -c "rm -rf .next/* && bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kosmo-backend:dev
    container_name: kosmo-backend
    init: true
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      PORT: '8000'
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      DEV_GENERATE_SECRETS: ${DEV_GENERATE_SECRETS:-1}
      AUTH_DISABLED: 'false'

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RAILWAY_CLIENT_ID: ${RAILWAY_CLIENT_ID:-}
      RAILWAY_CLIENT_SECRET: ${RAILWAY_CLIENT_SECRET:-}

      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-kosmo}:${POSTGRES_PASSWORD:-kosmo}@postgres:5432/${POSTGRES_DB:-kosmo_dev}}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-60}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kosmo_dev_redis_secret}
      REDIS_URL: redis://:${REDIS_PASSWORD:-kosmo_dev_redis_secret}@redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-150}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-100}

      JWT_PRIVATE_KEY_PATH: /tmp/kosmo-secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/kosmo-secrets/jwt_public.pem
      FERNET_MASTER_KEY: ${FERNET_MASTER_KEY}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-kosmo}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-kosmo-api}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}

      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}

      LLM_PROVIDER: ${LLM_PROVIDER:-noop}
      LLM_MODEL: ${LLM_MODEL:-noop}
      LLM_API_KEY: ${LLM_API_KEY:-}

      API_VERSION: ${API_VERSION:-v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      OPENCODE_BASE_URL: http://opencode:4096
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-kosmo-dev-password}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-deepseek/deepseek-flash}
      OPENCODE_TIMEOUT_SECONDS: ${OPENCODE_TIMEOUT_SECONDS:-900.0}
      OPENCODE_READ_TIMEOUT_SECONDS: ${OPENCODE_READ_TIMEOUT_SECONDS:-900.0}
      OPENCODE_CONNECT_TIMEOUT_SECONDS: ${OPENCODE_CONNECT_TIMEOUT_SECONDS:-30.0}
      KOSMO_WORKSPACES_DIR: /workspaces
      KOSMO_MCP_BASE_URL: ${KOSMO_MCP_BASE_URL:-http://backend:8000/mcp}

      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-kosmo-backend}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-development}
      PYTHONUNBUFFERED: '1'
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - kosmo_workspaces:/workspaces
    command: sh -c "uvicorn kosmo.infrastructure.api.main:app --host 0.0.0.0 --port $${PORT:-8000} --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if r.status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  opencode:
    image: node:22
    container_name: kosmo-opencode
    init: true
    # Mismo UID que el backend (kosmo=1000) para que los archivos que genere el
    # agente en /workspaces sean escribibles por la validación del backend.
    user: '1000:1000'
    ports:
      - '${OPENCODE_PORT:-4096}:4096'
    environment:
      HOME: /home/node
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-kosmo-dev-password}
      # Claves de proveedores LLM para que los agentes plan/build generen en local
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${LLM_API_KEY:-}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${LLM_API_KEY:-}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_PERMISSION: '{"read":{"*":"allow"},"edit":{"*":"allow"},"bash":"deny","external_directory":"deny","websearch":"allow"}'
    volumes:
      - kosmo_workspaces:/workspaces
    # Configura el password del servidor (clave server.password), el modelo LLM y
    # arranca headless. opencode se instala en el home del usuario 1000 porque
    # /usr/local (prefijo global por defecto) no es escribible por uid 1000.
    command: >
      sh -c 'npm install -g --prefix /home/node/opencode opencode-ai@latest &&
            mkdir -p /home/node/.config/opencode &&
            printf "{\"server\":{\"password\":\"%s\",\"model\":\"deepseek/deepseek-flash\"},\"permission\":{\"read\":{\"*\":\"allow\"},\"edit\":{\"*\":\"allow\"},\"bash\":\"deny\",\"external_directory\":\"deny\",\"websearch\":\"allow\"}}\n" "$${OPENCODE_SERVER_PASSWORD}" > /home/node/.config/opencode/opencode.json &&
            export PATH=/home/node/opencode/bin:$$PATH &&
            opencode serve --hostname 0.0.0.0 --port 4096'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kosmo-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kosmo_dev_redis_secret}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: kosmo-postgres
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kosmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosmo}
      POSTGRES_DB: ${POSTGRES_DB:-kosmo_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - kosmo_postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next_cache:
  kosmo_postgres_data:
  kosmo_workspaces:
